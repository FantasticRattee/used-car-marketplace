<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage listings | ONE2CAR</title>
    <meta name="description" content="Edit or delete ONE2CAR listings.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/product-modify/script.js"></script>
  </head>
  <body data-page="modify">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">
      <div class="container">
        <header class="page-head">
          <h1 class="page-head__title">Manage listings</h1>
          <p class="page-head__lede">Pick a listing, change what you need and save. Deleting removes the listing for everyone.</p>
        </header>

        <div class="picker" id="picker" hidden>
          <div class="field">
            <label for="car-picker">Listing to edit</label>
            <div class="picker__row">
              <select class="select" id="car-picker" aria-describedby="picker-hint">
                <option value="">Choose a listing</option>
              </select>
              <a class="btn btn--primary" href="/product-add">Add a new listing</a>
            </div>
            <p class="field__hint" id="picker-hint">Newest listings first.</p>
          </div>
        </div>

        <div id="empty-state"></div>

        <form id="listing-form" aria-label="Edit listing" hidden>
          <div class="form-actions">
            <button class="btn btn--danger-quiet" id="delete" type="button">Delete listing</button>
            <span class="form-actions__spacer"></span>
            <a class="btn btn--secondary" id="view-listing" href="/search-result">View listing</a>
            <button class="btn btn--primary" id="save" type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </main>

    <dialog class="dialog" id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-text">
      <form method="dialog">
        <div class="dialog__body">
          <h2 class="dialog__title" id="delete-title">Delete this listing?</h2>
          <p class="dialog__text" id="delete-text">It disappears from search and its link stops working. This can't be undone.</p>
        </div>
        <div class="dialog__actions">
          <button class="btn btn--secondary" value="cancel" autofocus>Keep listing</button>
          <button class="btn btn--danger" value="confirm">Delete listing</button>
        </div>
      </form>
    </dialog>

    <div id="site-footer"></div>
  </body>
</html>

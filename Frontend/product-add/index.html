<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a listing | ONE2CAR</title>
    <meta name="description" content="Add a used car listing to ONE2CAR.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/product-add/script.js"></script>
  </head>
  <body data-page="add">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">
      <div class="container">
        <header class="page-head">
          <h1 class="page-head__title">Add a listing</h1>
          <p class="page-head__lede">Everything except the fields marked optional is required. The listing goes live as soon as you publish it.</p>
        </header>

        <form id="listing-form" aria-labelledby="form-label" hidden>
          <span class="sr-only" id="form-label">New listing</span>
          <div class="form-actions">
            <a class="btn btn--secondary" href="/product-modify">Edit an existing listing</a>
            <span class="form-actions__spacer"></span>
            <a class="btn btn--secondary" href="/homepage">Cancel</a>
            <button class="btn btn--primary" id="publish" type="submit">Publish listing</button>
          </div>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>

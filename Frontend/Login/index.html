<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | ONE2CAR</title>
    <meta name="description" content="Log in to add, edit or remove ONE2CAR listings.">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/login/script.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="login">
      <div class="login__card">
        <div>
          <h1 class="login__title">Admin login</h1>
          <p class="login__lede">Log in to add, edit or remove listings. Browsing and searching cars does not need an account.</p>
        </div>

        <p class="form-alert" id="login-error" role="alert" hidden></p>

        <form class="login__form" id="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="50">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-affix input-affix--button">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
              <button class="input-affix__button" id="toggle-password" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password"></button>
            </div>
          </div>

          <button class="btn btn--primary btn--block" id="login-submit" type="submit">Log in</button>
        </form>

        <p class="login__note">Admin accounts are created by the site owner. There is no public sign-up.</p>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>

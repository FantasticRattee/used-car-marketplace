<!-- Login/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Car Selling Platform</title>
  <link rel="stylesheet" href="/Login/style.css">
</head>
<body>
  <main class="auth-layout">
    <!-- Left side banner -->
    <div class="auth-banner">
      <div class="banner-overlay"></div>
      
      <svg width="720" height="1024" viewBox="0 0 720 1024" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-overlay">
        <g clip-path="url(#clip0_2001_364)">
          <text fill="url(#paint0_linear_2001_364)" xml:space="preserve" style="white-space: pre" font-family="Poppins" font-size="56" font-style="italic" font-weight="300" letter-spacing="0em">
            <tspan x="89" y="512.1">WANT TO SELL YOUR </tspan>
            <tspan x="89" y="579.1">CAR? Quickly Easy </tspan>
            <tspan x="89" y="646.1">Fair Price!</tspan>
          </text>
          <g filter="url(#filter0_f_2001_364)">
            <circle cx="189.5" cy="954.5" r="189.5" fill="#2D55FB" />
          </g>
          <g filter="url(#filter1_f_2001_364)">
            <circle cx="774.5" cy="53.5" r="189.5" fill="#2D55FB" />
          </g>
        </g>
        <defs>
          <filter id="filter0_f_2001_364" x="-550" y="215" width="1479" height="1479" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feFlood flood-opacity="0" result="BackgroundImageFix" />
            <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
            <feGaussianBlur stdDeviation="275" result="effect1_foregroundBlur_2001_364" />
          </filter>
          <filter id="filter1_f_2001_364" x="35" y="-686" width="1479" height="1479" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feFlood flood-opacity="0" result="BackgroundImageFix" />
            <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
            <feGaussianBlur stdDeviation="275" result="effect1_foregroundBlur_2001_364" />
          </filter>
          <linearGradient id="paint0_linear_2001_364" x1="373" y1="459" x2="373" y2="660" gradientUnits="userSpaceOnUse">
            <stop stop-color="white" />
            <stop offset="1" stop-color="white" stop-opacity="0.44" />
          </linearGradient>
          <clipPath id="clip0_2001_364">
            <rect width="720" height="1025" fill="white" />
          </clipPath>
        </defs>
      </svg>

      <div class="logo-container">
        <img src="https://placehold.co/153x153/050A24/050A24" alt="Used Car Logo">
      </div>
    </div>

    <!-- Right side login form -->
    <div class="login-container">
      <div class="login-form-wrapper">
        <h1>Login to your account</h1>
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-container">
              <input type="text" id="username" name="username" placeholder="Enter your name" required>
            </div>
          </div>

          <div class="form-group">
            <div class="password-header">
              <label for="password">Password</label>
              <button type="button" class="forgot-password">Forgot?</button>
            </div>
            <div class="input-container password-container">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" id="togglePassword" class="toggle-password">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-action">
            <button type="submit" class="login-button">Login now</button>
            <div class="signup-prompt">
              <span>Don't Have An Account?</span>
              <button type="button" class="signup-link">Sign Up</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/Login/script.js"></script>
</body>
</html>

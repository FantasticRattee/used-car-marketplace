    <script>

document.addEventListener("DOMContentLoaded", () => {
    const logoutBtn = document.getElementById("logoutBtn");
    const loginBtn = document.querySelector(".btn-red");
    const editBtn = document.getElementById("editBtn");

    // 🔐 Login state check
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const role = localStorage.getItem("role");

    // 🔘 Show/hide buttons
    if (isLoggedIn) {
      logoutBtn.style.display = "block";
      if (loginBtn) loginBtn.style.display = "none";

      // Enable edit only for superadmin
      if (role === "superadmin") {
        editBtn.addEventListener("click", () => {
          window.location.href = "/product-add";
        });
      } else {
        editBtn.style.opacity = 0.5;
        editBtn.title = "Only superadmin can access this feature";
        editBtn.addEventListener("click", () => {
          alert("⚠️ Please login as superadmin to access this feature.");
        });
      }
    } else {
      logoutBtn.style.display = "none";
      if (loginBtn) loginBtn.style.display = "inline-block";

      // Disable Edit button entirely
      editBtn.style.opacity = 0.5;
      editBtn.title = "Please login to access";
      editBtn.addEventListener("click", () => {
        alert("⚠️ Please login as superadmin to access this feature.");
      });
    }

    // 🔴 Logout logic
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("role");
      localStorage.removeItem("loginTime");
      window.location.href = "/homepage";
    });
  });

    </script>

  <!-- Logout -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("isLoggedIn");
          localStorage.removeItem("role");
          localStorage.removeItem("loginTime");
          window.location.href = "/homepage"; // ✅ Redirect after clearing
        });
      }
    });

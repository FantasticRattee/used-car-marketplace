<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ONE2CAR | Used cars from dealers and private sellers</title>
    <meta name="description" content="Browse used cars from dealers and private sellers in Thailand. Compare price, mileage and specs, then call the seller.">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/homepage/script.js"></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container">
          <div class="hero__grid">
            <div>
              <h1 class="hero__title" id="hero-title">Find your next drive with confidence.</h1>
              <p class="hero__lede" id="hero-lede">Used cars from dealers and private sellers. Compare price, mileage and specs, then call the seller directly.</p>
            </div>
            <div id="featured" class="featured skeleton" aria-busy="true"></div>
          </div>

          <form class="search-panel search-panel--hero hero__search" id="hero-search" action="/search-result" method="get" role="search" aria-label="Search used cars">
            <div class="field field--keyword">
              <label for="hero-keyword">Keyword</label>
              <input class="input" id="hero-keyword" name="keyword" type="search" placeholder="Try Civic, M5 or GT3" autocomplete="off">
            </div>
            <div class="field">
              <label for="hero-brand">Brand</label>
              <select class="select" id="hero-brand" name="brand">
                <option value="">Any brand</option>
              </select>
            </div>
            <div class="field">
              <label for="hero-seller">Seller</label>
              <select class="select" id="hero-seller" name="sellerType">
                <option value="">Any seller</option>
                <option value="dealer">Dealer</option>
                <option value="private">Private seller</option>
              </select>
            </div>
            <button class="btn btn--primary search-panel__submit" type="submit">Search cars</button>
          </form>
        </div>
      </section>

      <section class="section" aria-labelledby="brands-title">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title" id="brands-title">Browse by brand</h2>
          </div>
          <ul class="brand-grid" id="brand-grid" aria-busy="true"></ul>
        </div>
      </section>

      <section class="section" aria-labelledby="latest-title">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title" id="latest-title">Newest listings</h2>
            <a class="section__link" id="see-all" href="/search-result">See all cars</a>
          </div>
          <div id="latest" aria-busy="true">
            <ul class="car-grid" id="latest-grid"></ul>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>

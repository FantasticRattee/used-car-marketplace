<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Used cars for sale | ONE2CAR</title>
    <meta name="description" content="Used car listings with price, mileage and seller details.">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/search-result/script.js"></script>
  </head>
  <body data-page="results">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">
      <div class="container">
        <header class="page-head">
          <h1 class="page-head__title" id="results-title">Used cars for sale</h1>
        </header>

        <form class="search-panel search-panel--filters" id="filter-form" action="/search-result" method="get" role="search" aria-label="Filter listings">
          <div class="field field--keyword">
            <label for="keyword">Keyword</label>
            <input class="input" id="keyword" name="keyword" type="search" placeholder="Name, model or feature" autocomplete="off">
          </div>
          <div class="field">
            <label for="brand">Brand</label>
            <select class="select" id="brand" name="brand">
              <option value="">Any brand</option>
            </select>
          </div>
          <div class="field">
            <label for="model">Model</label>
            <select class="select" id="model" name="model" disabled>
              <option value="">Any model</option>
            </select>
          </div>
          <div class="field">
            <label for="sellerType">Seller</label>
            <select class="select" id="sellerType" name="sellerType">
              <option value="">Any seller</option>
              <option value="dealer">Dealer</option>
              <option value="private">Private seller</option>
            </select>
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select class="select" id="sort" name="sort"></select>
          </div>
          <button class="btn btn--primary search-panel__submit" type="submit">Apply</button>
        </form>

        <div class="results-bar">
          <p class="results-bar__count" id="results-count" role="status">Loading listings…</p>
          <div class="results-bar__filters" id="active-filters"></div>
        </div>

        <div id="results" aria-busy="true">
          <ul class="car-grid" id="results-grid"></ul>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>

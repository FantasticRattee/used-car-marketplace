<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search used cars | ONE2CAR</title>
    <meta name="description" content="Search used cars by keyword, brand, model and seller type.">
    <link rel="icon" href="/shared/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/shared/one2car.css">
    <script src="/config.js"></script>
    <script type="module" src="/search/script.js"></script>
  </head>
  <body data-page="search">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">
      <div class="container">
        <header class="page-head">
          <h1 class="page-head__title">Search cars</h1>
          <p class="page-head__lede">Narrow the list by keyword, brand, model or seller type. Leave a field on "Any" to include everything.</p>
        </header>

        <form class="search-panel search-panel--full" id="search-form" action="/search-result" method="get" role="search" aria-label="Search used cars">
          <div class="field field--keyword">
            <label for="keyword">Keyword</label>
            <input class="input" id="keyword" name="keyword" type="search" placeholder="Name, model or feature, e.g. hybrid" autocomplete="off">
          </div>
          <div class="field">
            <label for="brand">Brand</label>
            <select class="select" id="brand" name="brand">
              <option value="">Any brand</option>
            </select>
          </div>
          <div class="field">
            <label for="model">Model</label>
            <select class="select" id="model" name="model" disabled>
              <option value="">Any model</option>
            </select>
          </div>
          <div class="field">
            <label for="sellerType">Seller</label>
            <select class="select" id="sellerType" name="sellerType">
              <option value="">Any seller</option>
              <option value="dealer">Dealer</option>
              <option value="private">Private seller</option>
            </select>
          </div>
          <button class="btn btn--primary search-panel__submit" type="submit">Show cars</button>
        </form>
      </div>

      <section class="section" aria-labelledby="brands-title">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title" id="brands-title">Or start with a brand</h2>
          </div>
          <ul class="brand-grid" id="brand-grid" aria-busy="true"></ul>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Marketplace</title>
    <meta name="description" content="Car Marketplace" />
    <meta name="author" content="Car Marketplace" />
    <!--  -->
    <link rel="stylesheet" href="styles.css">      
    <!--  -->
    <meta property="og:title" content="Car Marketplace" />
    <meta property="og:description" content="Car Marketplace" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@car_marketplace" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <!-- PASTE HERE? -->

  <body>
    <!-- Header Section -->
    <header class="header">
      <div class="header-container">
        <div class="header-content">
          <div class="header-left">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/95015a28c63bf87c0499879920000ea09f177fcc?placeholderIfAbsent=true"
              alt="Logo"
              class="logo"
            />

            <!-- Big Home button -->
            <div class="nav-buttons">


              <div class="nav-item" onclick="window.location.href='/'">Home</div>
              <div class="nav-item" onclick="window.location.href='/search'">Search</div>
              <div class="nav-item" onclick="window.location.href='/member'">Members</div>
              <div class="nav-item" id="logoutBtn">Logout</div>

              
            </div>
          </div>

          <div class="header-right">

            <!-- <button class="btn btn-yellow" onclick="window.location.href='/product-add'">Edit Car Selling/ADD</button> -->
            <button class="btn btn-yellow" id="editBtn">Edit Car Selling/ADD</button>


            <!-- <button class="btn btn-red">LOGIN</button> -->
            <button class="btn btn-red" onclick="window.location.href='/login'">LOGIN</button>

          </div>
        </div>
        <div class="header-border"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="hero-section">
        <div class="hero-image-container">
          <img
            src="https://cdn.builder.io/api/v1/image/assets/TEMP/c3207d8e877b1c086d83018dd14a5246c88d4ea3?placeholderIfAbsent=true"
            alt="Hero"
            class="hero-image"
          />
        </div>
        <div class="search-panel-container">


          <form id="search-form" class="search-panel" action="/searchpage-result" method="GET">
            <div class="search-field">
              <select id="brand" name="brand" class="select-field" aria-label="Select Brand">
                <option value="">Select Brand</option>
                <option value="bmw">BMW</option>
                <option value="mercedes">Mercedes</option>
                <option value="honda">Honda</option>
                <option value="toyota">Toyota</option>
                <option value="audi">Audi</option>
                <option value="porsche">Porsche</option>
              </select>
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c" class="dropdown-arrow" alt="Dropdown arrow" />
            </div>

            <div class="search-field">
              <select id="model" name="model" class="select-field" aria-label="Select Model">
                <option value="">Select Model</option>
                <option value="330">330</option>
                <option value="520">520</option>
                <option value="cls">CLS</option>
              </select>
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c" class="dropdown-arrow" alt="Dropdown arrow" />
            </div>

            <div class="search-field">
              <select id="sellerType" name="sellerType" class="select-field" aria-label="Select Seller Type">
                <option value="">Select Seller Type</option>
                <option value="dealer">Dealer</option>
                <option value="private">Private</option>
              </select>
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c" class="dropdown-arrow" alt="Dropdown arrow" />
            </div>

            <button class="btn btn-black" type="submit">Go View</button>
          </form>



        </div>
      </div>
    </main>

    <!-- Car Grid Section -->
    <section class="car-grid-section">
      <h2 class="car-grid-title">Explore Our Cars</h2>
      <div class="car-grid" id="carGrid">
        <!-- Car cards will be inserted here by JavaScript -->
      </div>
    </section>

    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <!--  -->
    <script src="script.js"></script>
    <!--  -->


    <script>
      const brandToModels = {
        bmw: ["330", "520"],
        mercedes: ["cls", "cle"],
        honda: ["civic", "accord"],
        toyota: ["supra", "gr corolla"],
        audi: ["a3", "q5"],
        porsche: ["911", "cayenne", "panamera"]
      };
    
      document.addEventListener("DOMContentLoaded", () => {
        const brandSelect = document.getElementById("brand");
        const modelSelect = document.getElementById("model");
    
        brandSelect.addEventListener("change", () => {
          const selectedBrand = brandSelect.value.toLowerCase();
          const models = brandToModels[selectedBrand] || [];
    
          // Clear current model options
          modelSelect.innerHTML = '<option value="">Select Model</option>';
    
          // Populate new options
          models.forEach(model => {
            const option = document.createElement("option");
            option.value = model.toLowerCase();
            option.textContent = model;
            modelSelect.appendChild(option);
          });
        });
      });
    </script>

  <!-- Logout -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("isLoggedIn");
          localStorage.removeItem("role");
          localStorage.removeItem("loginTime");
          window.location.href = "/homepage"; // ✅ Redirect after clearing
        });
      }
    });
  </script>


  </body>
</html>

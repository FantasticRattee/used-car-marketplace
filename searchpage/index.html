<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Cars Marketplace</title>
  <meta name="description" content="Find used cars from top brands" />
  <link rel="stylesheet" href="/searchpage/style.css" />
  <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/fd4ea47600148383597968bf7b1c644d04243f31" alt="Used Car Logo" />
      </div>
      <nav class="navigation">
        <div class="nav-item" onclick="window.location.href='/homepage'">Home</div>
        <div class="nav-item" onclick="window.location.href='/search'">Search</div>
      </nav>
      <div class="header-buttons">
        <!-- <button class="yellow-button" onclick="window.location.href='/product-add'">Edit Car Selling/ADD</button> -->
        <!-- <button class="red-button" onclick="window.location.href='/login'">LOGIN</button> -->
      </div>
    </header>

    <main class="main-content">
      <div class="brands-section">
        <h2 class="section-title">BEST SELLER</h2>
        <div class="brand-grid" id="brandGrid">
          <!-- Brand cards injected via JS -->
        </div>
      </div>

      <div class="search-section"> 
        <form id="search-form" class="search-form" action="/search-result" method="GET">
          <!-- Search box -->
          <input
            type="text"
            id="searchKeyword"
            name="keyword"
            class="search-field-box"
            placeholder="Search..."
          />

          <!-- Brand -->
          <div class="form-control">
            <div class="select-wrapper">
              <select id="brand" name="brand" class="select-field">
                <option value="">Select Brand</option>
                <option value="Audi">Audi</option>
                <option value="BMW">BMW</option>
                <option value="Porsche">Porsche</option>
                <option value="Mercedes Benz">Mercedes Benz</option>
                <option value="Toyota">Toyota</option>
                <option value="Honda">Honda</option>
              </select>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c"
                class="dropdown-arrow"
                alt="Dropdown arrow"
              />
            </div>
          </div>

          <!-- Model -->
          <div class="form-control">
            <div class="select-wrapper">
              <select id="model" name="model" class="select-field">
                <option value="">Select Model</option>
              </select>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c"
                class="dropdown-arrow"
                alt="Dropdown arrow"
              />
            </div>
          </div>

          <!-- Seller Type -->
          <div class="form-control">
            <div class="select-wrapper">
              <select id="sellerType" name="sellerType" class="select-field">
                <option value="">Select Seller Type</option>
                <option value="dealer">Dealer</option>
                <option value="private">Private</option>
              </select>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/954ac8b96d52f9ccf02b8d0e470cc6c398db6b0c"
                class="dropdown-arrow"
                alt="Dropdown arrow"
              />
            </div>
          </div>

          <button type="submit" class="search-button">Go View</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/searchpage/script.js"></script>
</body>
</html>
